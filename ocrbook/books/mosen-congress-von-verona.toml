# Julius Mosen, Der Congreß von Verona (Sämmtliche Werke, vol. 5, 1863), from the University
# of Toronto scan on archive.org. Fraktur, one witness (ocrbook's own OCR), read in two
# Tesseract layout modes with the better one kept. The camera captures alternate by 180°.
#
# This profile reproduces the first machine transcription (scripts/extract_mosen_fraktur.py).
# The reviewed transcription made from it later was checked against other editions and is
# finished work: it is not regenerated from here. That review found printed page 1 on scan
# 15 (this profile starts at scan 16, page 2).

title = "Der Congreß von Verona"
author = "Julius Mosen"
language = "de"

[archive]
item = "smtlichewerke05moseuoft"
files = ["_orig_jp2.tar"]

[scans]
file = "smtlichewerke05moseuoft_orig_jp2.tar"

[ocr]
lang = "frk"
psm = [3, 4]
rotate_even = 90
rotate_odd = 270
crop = "paper"
enhance = true

[text]
sources = ["reocr"]

# Scans 16-254 are in printed order (pp. 2-240). The last eight pages were captured in
# reverse: scans 262 down to 255 are pp. 241-248.
[[sequence]]
scans = [16, 254]
first_page = 2

[[sequence]]
scans = [262, 255]
first_page = 241

[clean]
enabled = true
running_heads = ['Mosen.*(?:Werke|Berke)']

# Order matters: these fixes must run before the fraktur ruleset turns "c<" into "ch".
[[clean.rules]]
[clean.rules.literal]
"Stüc<hen" = "Stückchen"
"Stüc>hen" = "Stückchen"
"doc<h" = "doch"
"durc<" = "durch"
"baro&e" = "barocke"
"zurü&" = "zurück"
"De&el" = "Deckel"

# Long s is normalised to s in this edition.
[[clean.rules]]
literal = { "ſ" = "s" }

[[clean.rules]]
ruleset = "fraktur"

# OCR misreadings in this book, whole words only.
